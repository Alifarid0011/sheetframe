name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash scripts/build-demo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test docs/workflows.test.mjs
